<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="YumeRise Next — a calm, offline-first productivity app for tasks, planning, focus sessions and honest progress." />
    <title>YumeRise Next</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script>
      // Apply the persisted theme + dark accent before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('yrn.theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
        var a = localStorage.getItem('yrn.accent');
        document.documentElement.dataset.accent = a === 'graphite' ? 'graphite' : 'rose';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.dataset.accent = 'rose';
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <noscript>

        <h1>JavaScript is required</h1>
        <p>YumeRise Next stores your tasks, goals and focus sessions locally and needs JavaScript to run. Please enable it and reload.</p>
      </div>
    </noscript>
